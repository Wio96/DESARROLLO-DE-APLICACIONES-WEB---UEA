{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <div class="card shadow">
        <div class="card-header bg-warning text-dark">
            <h3>Editar Reserva #{{ r.codigo_reserva }}</h3>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>ID Cliente:</label>
                        <input type="number" name="id_cliente" class="form-control" value="{{ r.id_cliente }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>ID Paquete:</label>
                        <input type="number" name="id_paquete" class="form-control" value="{{ r.id_paquete }}" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Fecha de Viaje:</label>
                        <input type="date" name="fecha_viaje" class="form-control" value="{{ r.fecha_viaje }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Cantidad Pasajeros:</label>
                        <input type="number" name="cantidad_pasajeros" class="form-control" value="{{ r.cantidad_pasajeros }}" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label>Estado:</label>
                    <select name="estado" class="form-select">
                        <option value="Confirmado" {% if r.estado == 'Confirmado' %}selected{% endif %}>Confirmado</option>
                        <option value="Pendiente" {% if r.estado == 'Pendiente' %}selected{% endif %}>Pendiente</option>
                    </select>
                </div>
                <hr>
                <div class="d-flex justify-content-end">
                    <a href="{{ url_for('listar_reserva') }}" class="btn btn-secondary me-2">Cancelar</a>
                    <button type="submit" class="btn btn-success">Guardar Cambios en MySQL</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
